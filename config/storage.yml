test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Use bin/rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
# amazon:
#   service: S3
#   access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
#   secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
#   region: us-east-1
#   bucket: your_own_bucket-<%= Rails.env %>

supabase:
  service: S3
  endpoint: <%= ENV.fetch('SUPABASE_STORAGE_ENDPOINT', '').inspect %>
  # Same bucket as production. The region is part of the SigV4 signature:
  # the local stack uses "local" (supabase status -o env → S3_PROTOCOL_REGION),
  # hosted Supabase uses "sa-east-1".
  region: <%= ENV.fetch('SUPABASE_STORAGE_REGION', 'sa-east-1').inspect %>
  bucket: contents-class
  access_key_id: <%= ENV.fetch('SUPABASE_KEY', '').inspect %>
  secret_access_key: <%= ENV.fetch('SUPABASE_KEY_SECRET', '').inspect %>
  force_path_style: true

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

