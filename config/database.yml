# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  database: educator_lms_development
test:
  <<: *default
  # The Rails merges DATABASE_URL over database.yml for the current environment,
  # so this URL must NOT include a database name — otherwise it would win over
  # the `database:` key below and the suite would run against another database
  # (e.g. development). The name is defined here, per environment.
  url: <%= ENV["DATABASE_URL"] %>
  database: educator_lms_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  database: educator_lms_production
